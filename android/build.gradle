// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  configurations.all {
    // react-native-video 5.x pulls in com.github.adityaxjha:Android-ScalableVideoView
    // via JitPack, which declares com.android.support:appcompat-v7:31.0.0 — a version
    // that does not exist. This project uses android.useAndroidX=true, so the old
    // support library is not needed at all. Excluding it removes the missing-version
    // error and prevents duplicate-class conflicts with the AndroidX equivalents.
    exclude group: 'com.android.support', module: 'appcompat-v7'
    exclude group: 'com.android.support', module: 'support-compat'
    exclude group: 'com.android.support', module: 'versionedparcelable'
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
